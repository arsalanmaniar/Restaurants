name: Keep Render warm

# Render's free tier spins the backend down after ~15 minutes of inactivity, and a
# cold start takes ~34 seconds. Wassender's webhook delivery times out long before
# that, so an idle instance silently drops inbound WhatsApp messages — and because a
# dropped message produces no traffic, the instance never warms back up. That is a
# self-sustaining outage: the bot goes quiet and stays quiet.
#
# This workflow keeps the instance awake so a real customer message always lands on a
# warm server.
#
# Why each run pings repeatedly instead of once: GitHub's `schedule` trigger is
# best-effort and routinely fires several minutes late (occasionally it skips a run
# entirely under load). A single ping every 10 minutes would therefore drift past the
# ~15-minute idle window. Each run instead pings every 2 minutes for ~9 minutes, so
# consecutive runs overlap and normal scheduling jitter cannot open a 15-minute gap.
# If a lapse ever does happen, the next ping wakes the instance itself — the cost is
# one slow ping, not a dropped customer message.

"on":
  schedule:
    # Every 10 minutes. Combined with the in-run ping loop below this tolerates the
    # usual few-minutes of GitHub scheduling delay.
    - cron: "*/10 * * * *"
  # So it can be kicked off by hand before a live test, without waiting for the cron.
  workflow_dispatch:

# Never let a delayed run pile up behind the previous one; the newest is what matters.
concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    # A stuck run must not hold the concurrency group past its usefulness.
    timeout-minutes: 15

    steps:
      - name: Ping /health every 2 minutes for ~9 minutes
        env:
          # The backend's public URL. Change this here if the Render service moves —
          # it is the only place the host is written.
          HEALTH_URL: https://restaurants-5tbm.onrender.com/health
        run: |
          set -u
          successes=0
          for i in 1 2 3 4 5; do
            # --max-time 90 is deliberately generous: if the instance HAS gone to
            # sleep this ping is the thing waking it, and that takes ~34s.
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$HEALTH_URL" || echo "000")
            printf 'ping %d: HTTP %s\n' "$i" "$code"
            if [ "$code" = "200" ]; then
              successes=$((successes + 1))
            fi
            # No sleep after the final ping — it would just idle the runner.
            if [ "$i" -lt 5 ]; then
              sleep 120
            fi
          done

          echo "successful pings: $successes/5"
          # One flaky ping is not worth an alert email, but zero successes across nine
          # minutes means the backend is genuinely down — fail so it surfaces.
          if [ "$successes" -eq 0 ]; then
            echo "::error::Backend did not respond to any health check over ~9 minutes."
            exit 1
          fi
